name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install AFKPlus dependency
        run: |
          curl -fL "https://github.com/LapisPlugins/AFKPlus/releases/download/3.5.2/AFKPlus.jar" -o AFKPlus.jar
          mvn install:install-file \
            -Dfile=AFKPlus.jar \
            -DgroupId=net.lapismc \
            -DartifactId=AFKPlus \
            -Dversion=3.5.2 \
            -Dpackaging=jar \
            -DgeneratePom=true \
            --no-transfer-progress

      - name: Build with Maven
        run: mvn clean package --no-transfer-progress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFKPlusPAPI
          path: target/AFKPlusPAPI.jar
          if-no-files-found: error
